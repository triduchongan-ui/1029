<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>開發者作品集</title>

<style>

* {

margin: 0;

padding: 0;

box-sizing: border-box;

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}

body {

background-color: #0f172a;

color: #f8fafc;

display: flex;

justify-content: center;

align-items: center;

min-height: 100vh;

padding: 20px;

}

.card {

background: #1e293b;

padding: 40px;

border-radius: 16px;

box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

max-width: 500px;

width: 100%;

text-align: center;

border: 1px solid #334155;

}

.avatar {

width: 100px;

height: 100px;

border-radius: 50%;

background: linear-gradient(135deg, #3b82f6, #8b5cf6);
該
display: flex;

align-items: center;

justify-content: center;

font-size: 36px;

font-weight: bold;

margin: 0 auto 20px;

box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);

}

h1 {

font-size: 24px;

margin-bottom: 8px;

color: #ffffff;

}

p.title {

color: #38bdf8;

font-size: 16px;

margin-bottom: 16px;

font-weight: 500;

}

p.desc {

color: #94a3b8;

font-size: 14px;

line-height: 1.6;

margin-bottom: 24px;

}

.tags {

display: flex;

gap: 8px;

justify-content: center;

flex-wrap: wrap;

margin-bottom: 24px;

}

.tag {

background: #334155;

color: #cbd5e1;

padding: 6px 12px;

border-radius: 20px;

font-size: 12px;

}

.btn {

display: inline-block;

background: #3b82f6;

color: #ffffff;

padding: 12px 24px;

border-radius: 8px;

text-decoration: none;

font-weight: 600;

transition: background 0.3s ease;

}

.btn:hover {

background: #2563eb;

}

</style>

</head>

<body>

<div class="card">

<div class="avatar">DEV</div>

<h1>您好，我是開發者</h1>

<p class="title">人工智慧與軟體工程師</p>

<p class="desc">專注於開發Web應用程式、人工智慧模型和現代技術解決方案。 </p>

<div class="tags">

<span class="tag">Python</span>

<span class="tag">JavaScript</span>

<span class="tag">OpenCV</span>

<span class="tag">PyTorch</span>

</div>

<a href="https://github.com" class="btn" target="_blank">訪問GitHub</a>

</div>

</body>

</html>
